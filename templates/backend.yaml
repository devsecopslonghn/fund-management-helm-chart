{{- if .Values.backend.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fund-management-backend
  labels:
    {{- include "fund-management-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fund-management
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fund-management
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.backend.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.scheduling.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: fund-management
                    app.kubernetes.io/component: backend
      {{- end }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          envFrom:
            - secretRef: {name: {{ .Values.backend.runtimeSecret }}}
            - secretRef: {name: {{ .Values.backend.adminSecret }}}
          # Optional keys in runtimeSecret (never committed here):
          # FUND_GMAIL_OAUTH_CLIENT_ID, FUND_GMAIL_OAUTH_CLIENT_SECRET,
          # FUND_GMAIL_OAUTH_REDIRECT_URI, FUND_GMAIL_TOKEN_ENCRYPTION_KEY,
          # FUND_GMAIL_MONITORED_ADDRESS. Gmail remains disabled unless
          # FUND_GMAIL_ENABLED/FUND_GMAIL_POLLING_ENABLED are explicitly true.
          env:
            - {name: MONGODB_DATABASE, value: fund_management}
            - {name: APP_ALLOWED_ORIGINS, value: https://quybpdev.apps.drgdevlab.com}
            {{- if .Values.backend.observability.enabled }}
            - {name: OTEL_SERVICE_NAME, value: fund-management-backend}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.backend.observability.endpoint | quote }}}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment={{ .Values.backend.observability.environment }},service.namespace={{ .Release.Namespace }}"}
            - {name: OTEL_TRACES_EXPORTER, value: otlp}
            - {name: OTEL_METRICS_EXPORTER, value: otlp}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: {{ .Values.backend.observability.traceSampling | quote }}}
            - {name: OTEL_INSTRUMENTATION_HTTP_EXCLUDED_URLS, value: "^/actuator/health$"}
            {{- end }}
            {{- if .Values.backend.gmailPubsub.enabled }}
            - {name: FUND_GMAIL_EVENT_ENABLED, value: "true"}
            - {name: FUND_GMAIL_PUBSUB_TOPIC_NAME, value: {{ .Values.backend.gmailPubsub.topicName | quote }}}
            - name: FUND_GMAIL_PUBSUB_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.gmailPubsub.secretName }}
                  key: token
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: fund-management-backend
  labels:
    {{- include "fund-management-backend.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: fund-management
    app.kubernetes.io/component: backend
  ports:
    - {name: http, port: 8080, targetPort: http}
