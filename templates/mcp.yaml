{{- if and .Values.mcp.enabled .Values.mcp.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fund-management-mcp
  labels:
    app.kubernetes.io/name: fund-management
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fund-management
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fund-management
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: fund-management-mcp
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          envFrom:
            - secretRef: {name: {{ .Values.mcp.adminSecret }}}
            - secretRef: {name: {{ .Values.mcp.runtimeSecret }}}
          env:
            - {name: MCP_TRANSPORT, value: http}
            - {name: FUND_API_BASE_URL, value: {{ .Values.mcp.backendBaseUrl | quote }}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.mcp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: fund-management-mcp
  labels:
    app.kubernetes.io/name: fund-management
    app.kubernetes.io/component: mcp
spec:
  selector:
    app.kubernetes.io/name: fund-management
    app.kubernetes.io/component: mcp
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- if .Values.mcp.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fund-management-mcp
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.mcp.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fund-management-mcp
                port: {number: 8080}
  tls:
    - hosts: [{{ .Values.mcp.ingress.domain }}]
{{- end }}
{{- end }}