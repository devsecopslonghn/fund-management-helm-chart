# The application repositories publish immutable GHCR images and update the
# corresponding image tags here after successful CI.
imagePullSecret: ghcr-pull

frontend:
  domain: quybpdev.apps.drgdevlab.com
  image:
    repository: ghcr.io/devsecopslonghn/fund-management-frontend
    tag: a31a3320735906dcca31b37805a23d368ad11467@sha256:6ee335f921446e2d05ffbab7d2d6eaf4a5ab43b9efaeb330be509e1c52412f99
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 32Mi}
    limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi}

backend:
  image:
    repository: ghcr.io/devsecopslonghn/fund-management-backend
    tag: e87eef180200077dcdb81b0a93f1cd9af6ae18af@sha256:1022d5d0e64d0e69aa518a41bece255e184c51acf75bcb0e594236971517ad69
    pullPolicy: IfNotPresent
  observability:
    enabled: true
    endpoint: http://collector.observability-dev.svc.cluster.local:4317
    environment: dev
    traceSampling: "0.10"
  runtimeSecret: fund-management-runtime
  adminSecret: fund-management-admin
  gmailPubsub:
    enabled: true
    topicName: projects/fund-management-prod/topics/fund-management-gmail-events
    secretName: fund-management-gmail-pubsub
  replicas: 2
  scheduling:
    nodeSelector: {}
    podAntiAffinity: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  backup:
    enabled: false
    schedule: "30 1 * * *"
    timeZone: Asia/Ho_Chi_Minh
    retentionDays: 30
    image: mongo:8.0
    storageClassName: longhorn-workers
    storageSize: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}
    limits: {cpu: 500m, memory: 768Mi, ephemeral-storage: 256Mi}

mcp:
  enabled: true
  image:
    repository: ghcr.io/devsecopslonghn/fund-management-mcp
    tag: 95ce96daac68fc4279cd6dcfffc8b5d508ec59c9@sha256:70400603bd3442da4eb624dc79b37a7e60ac08fd07e285c958d552be20ec218c
    pullPolicy: IfNotPresent
  replicas: 1
  backendBaseUrl: http://fund-management-backend.fund-management.svc.cluster.local:8080/api/v1
  adminSecret: fund-management-admin
  runtimeSecret: fund-management-mcp
  auth:
    mode: oauth
    publicBaseUrl: https://mcp-quybpdev.apps.drgdevlab.com
    oauth:
      issuer: https://auth.apps.drgdevlab.com/realms/kubernetes
      audience: https://mcp-quybpdev.apps.drgdevlab.com
      metadataUrl: ""
  ingress:
    enabled: true
    domain: mcp-quybpdev.apps.drgdevlab.com
  resources:
    requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 32Mi}
    limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi}
